server.port=8080

# OpenAI API Key Placeholder
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:demo}
langchain4j.open-ai.embedding-model.api-key=${OPENAI_API_KEY:demo}

# Gemini API Key Placeholder (using google-ai-gemini if possible, or vertex if needed. The pom uses vertex for standard but we can just use generic property here)
# If using Vertex AI, project-id and location are needed. If Google MakerSuite, use google-ai-gemini
# For standard standard API key from AI Studio
langchain4j.google-ai.gemini.chat-model.api-key=${GEMINI_API_KEY:demo}
langchain4j.google-ai.gemini.chat-model.model-name=gemini-2.5-flash

# Logging
logging.level.dev.langchain4j=DEBUG
